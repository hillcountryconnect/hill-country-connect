<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Hill Country Connect · Full Clickable Prototype</title><link rel="preconnect" href="https://fonts.googleapis.com/"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600&display=swap" rel="stylesheet">
<style>

px solid #eae6de}.headrow{display:flex;align-items:center;justify-content:space-between;height:20px;font-size:9px;color:var(--sub)}.app-head h2{font:600 17px Poppins,Inter;margin:9px 0 7px}.role-switch{display:flex;gap:4px;overflow:auto}.role-switch button{font-size:9px;padding:5px 8px;white-space:nowrap}.role-switch button.active{background:var(--pri);color:white;border-color:var(--pri)}.scroll{position:absolute;top:122px;bottom:59px;left:0;right:0;overflow-y:auto;padding:13px 14px 17px;scrollbar-width:thin}.bottom{position:absolute;bottom:0;left:0;right:0;height:59px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:2}.bottom button{border:0;border-radius:0;background:transparent;padding:5px 1px;color:var(--sub);font-size:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.bottom button.active{color:var(--pri);font-weight:700}.bottom i{font-style:normal;font-size:15px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px}.eyebrow{font-size:8px;letter-spacing:.8px;color:var(--sub);font-weight:700;text-transform:uppercase;margin:0 0 6px}.title{font:600 16px Poppins,Inter;margin:0 0 8px}.copy{font-size:10px;line-height:1.55;color:var(--sub);margin:4px 0}.small{font-size:9px;color:var(--sub);line-height:1.5}.pill{display:inline-block;background:#e6f0ea;color:var(--pri);padding:4px 7px;border-radius:20px;font-size:8px;font-weight:700}.btn{border:0;border-radius:9px;background:var(--pri);color:#fff;padding:10px 12px;font-size:10px;font-weight:700;cursor:pointer}.btn.full{width:100%}.btn.secondary{background:#e6f0ea;color:var(--pri)}.btn.ghost{background:white;border:1px solid var(--line);color:var(--pri)}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid #edf0ec}.row:first-child{border-top:0}.row b{font-size:10px}.row small{display:block;font-size:8px;color:var(--sub);margin-top:3px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:9px}.stat{padding:10px 8px;background:#fff;border:1px solid var(--line);border-radius:10px}.stat small{display:block;font-size:8px;color:var(--sub)}.stat b{font-size:13px;display:block;margin-top:5px}.weather{display:flex;align-items:center;gap:9px}.weather-icon{font-size:20px}.weather strong{font-size:11px}.weather small{display:block;font-size:8px;color:var(--sub);margin-top:4px}.live{font-size:7px!important;color:var(--pri)!important;font-weight:700}.notice{background:#F2F6F2;color:#506459;border:1px solid #DEE7DF;border-radius:9px;padding:10px;font-size:9px;line-height:1.5;margin:8px 0}.risk{color:#a4691e}.ring{width:54px;height:54px;border:5px solid #dcebdc;border-top-color:var(--pri);border-radius:50%;display:grid;place-items:center;font-weight:700;color:var(--pri);font-size:12px;flex:0 0 auto}.split{display:flex;align-items:center;gap:12px}.field{display:flex;flex-direction:column;gap:5px;font-size:9px;font-weight:600;color:#52645d;margin:8px 0}.field input,.field select,.field textarea,.search{border:1px solid var(--line);border-radius:8px;padding:9px;font:10px Inter,Arial;background:#fff;color:var(--fg);width:100%}.field textarea{height:108px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}.badge{font-size:8px;border-radius:10px;padding:4px 7px;background:#f2f4f0;color:var(--sub)}.timeline{padding-left:13px;border-left:2px solid #dce7dd;margin:12px 0}.timeline .stop{position:relative;padding:0 0 12px;font-size:9px}.timeline .stop:before{content:'';position:absolute;left:-18px;top:1px;width:8px;height:8px;border:2px solid var(--pri);border-radius:50%;background:white}.timeline small{display:block;color:var(--sub);margin-top:3px}.mapbox{height:195px;border-radius:10px;overflow:hidden;background:#e7ede6;position:relative;margin:8px 0}.mapbox #routeMapCanvas{width:100%;height:100%}.mapbox .maptag{z-index:500}.map-error{position:absolute;z-index:500;bottom:8px;left:8px;right:8px;background:#fff;border-radius:7px;padding:7px;font-size:8px;color:#8a4a3d;box-shadow:0 2px 8px #0002}.maptag{position:absolute;top:8px;left:8px;background:white;border-radius:8px;padding:7px 9px;font-size:8px;color:var(--sub);box-shadow:0 2px 8px #0002}.maptag b{display:block;font-size:11px;color:var(--fg);margin-top:3px}.tabrow{display:flex;gap:5px;overflow:auto;margin:8px 0}.tabrow button{font-size:8px;padding:6px 8px;white-space:nowrap}.tabrow button.active{background:#e6f0ea;color:var(--pri)}.crop{border-top:1px solid #edf0ec;padding:10px 2px;display:flex;justify-content:space-between;align-items:center;font-size:9px;cursor:pointer}.crop:first-of-type{border-top:0}.crop small{display:block;color:var(--sub);margin-top:3px}.alertitem{display:flex;gap:9px;padding:10px 0;border-top:1px solid #edf0ec;font-size:9px}.alerticon{width:25px;height:25px;display:grid;place-items:center;background:#fbf2df;border-radius:8px;flex:none}.alertitem b{font-size:9px}.alertitem small{display:block;color:var(--sub);margin-top:4px;line-height:1.45}.product{display:flex;gap:9px;align-items:center;padding:10px 0;border-top:1px solid #edf0ec}.flower{width:39px;height:39px;border-radius:9px;background:#f3e1e5;display:grid;place-items:center;font-size:19px;flex:none}.product b{font-size:10px}.product small{display:block;color:var(--sub);font-size:8px;margin-top:3px}.photo{height:72px;background:#edf1eb;border-radius:9px;display:grid;place-items:center;color:var(--sub);font-size:9px}.footnote{font-size:8px;color:var(--sub);line-height:1.5}.place{padding:11px;background:#f6f7f3;border-radius:9px;margin:7px 0}.place b{font-size:10px}.place small{display:block;color:var(--sub);margin-top:4px}.hidden{display:none!important}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#20352b;color:white;padding:9px 13px;border-radius:9px;z-index:8;font-size:10px;opacity:0;transition:.2s}.toast.show{opacity:1}.show .phone button[data-page],.show .phone button[data-role],.show .phone button[data-action]{outline:1px dashed var(--coral)}
@media(max-width:600px){header{padding-top:9px}.stage{margin-top:4px}.toolbar button{font-size:10px}.jumps{max-width:440px}.cap{margin-bottom:5px}}

/* readability and tap-target fixes */
.welcome-roles button{border:1px solid var(--pri);background:#fff;height:44px;font-size:14px}.welcome-roles button:first-child{background:var(--pri)}

</style></head><body>
<header><h1>Hill Country Connect</h1><p>Full clickable prototype · all website sections and role journeys</p></header>
<div class="toolbar"><button id="back">Back</button><button id="restart">Restart</button><button id="toggle">Show tappable areas</button><button id="rotate">Switch role</button></div><div class="jumps" id="jumps"></div><div class="stage" id="stage"></div><div class="cap" id="cap"></div><div id="toast" class="toast"></div>
<script>
const pages=[
['welcome','Role selection'],['overview','Overview dashboard'],['batches','My batches and notebook'],['routes','Routes map'],['care','Care guide'],['alerts','Alerts and barriers'],['register','Register a batch'],['seller','Farmer seller dashboard'],['driver','Driver route and checkpoint'],['shop','Buyer flower shop'],['product','Product details'],['cart','Cart and checkout'],['track','Track order'],['countdown','Vase-life care'],['guarantee','Freshness guarantee'],['crowd','Tourist crowd forecast'],['places','Quieter places and directory']
];let page='welcome',role='Farmer',hist=['welcome'],batch='HC–2048',category='All',query='',map=null,routeLayer=null,routeRequest=0,leafletPromise=null;
const navPages=[['overview','⌂','Home'],['batches','✿','Batches'],['routes','↗','Routes'],['care','▤','Care'],['alerts','!','Alerts']];
const batches=[['HC–2048','Roses','120 stems · Nuwara Eliya → Colombo','In transit','78%'],['HC–2046','Carnations','240 stems · Ragala → Kandy','Delivered','88%'],['HC–2045','Chrysanthemums','180 stems · Nuwara Eliya → Colombo','In transit','81%']];
function btn(text,target,kind='btn'){return '<button class="'+kind+'" data-page="'+target+'">'+text+'</button>'}
function card(title,body,eyebrow=''){return '<section class="card">'+(eyebrow?'<p class="eyebrow">'+eyebrow+'</p>':'')+(title?'<h3 class="title">'+title+'</h3>':'')+body+'</section>'}
function weatherCard(){return '<section class="card weather"><span class="weather-icon" id="weatherIcon">⛅</span><div><strong id="weatherValue">Weather updating…</strong><small id="weatherDetails">Nuwara Eliya · Sri Lanka</small><small id="weatherUpdated" class="live">Connecting to live weather</small></div></section>'}
function routeMap(){return '<div class="mapbox"><div id="routeMapCanvas" aria-label="Interactive road route map"></div><div class="maptag"><span>Estimated drive</span><b id="eta">Finding route…</b></div></div>'}
function roleHome(){return ({Farmer:'register',Driver:'driver',Buyer:'shop',Tourist:'crowd'})[role]}
function bodyFor(id){
if(id==='overview')return '<p class="eyebrow" id="localClock">— · SRI LANKA TIME</p><h3 class="title" id="greeting">Good morning</h3><p class="copy">Here’s what’s happening across your flower journeys.</p>'+weatherCard()+'<div class="stats"><div class="stat"><small>Batches</small><b>3</b></div><div class="stat"><small>Freshness average</small><b>82%</b></div><div class="stat"><small>On the road</small><b>2</b></div></div>'+card('Roses to Colombo','<div class="split"><div class="ring">78</div><div><b style="font-size:10px">About 6.7 days left</b><p class="small">Temperature risk: Watch · cabin about 28°C</p><p class="small">Lost so far: 3.3 vase-life days</p></div></div><div class="timeline"><div class="stop"><b>Nuwara Eliya</b><small>Picked up · 8:42 AM</small></div><div class="stop"><b>Kandy</b><small>Current checkpoint · Fog delay</small></div><div class="stop"><b>Colombo</b><small>Destination · ETA 2:35 PM</small></div></div>'+btn('Check in at Kandy','driver')+' '+btn('View route','routes','btn secondary'),'JOURNEY IN PROGRESS · HC–2048')+card('Barriers and next steps','<div class="notice"><b>Fog or rain delay</b><br>Low visibility may add 2 hours. Review dispatch timing and check road conditions.</div><p class="copy">Also monitor road closures, tourist traffic, cabin heat, rough handling, long stops and delivery evidence.</p>'+btn('See all alerts','alerts','btn ghost'))+card('Quick actions',btn('Register a batch','register')+' '+btn('Open my batches','batches','btn secondary'));
if(id==='batches')return '<p class="eyebrow">FRESH CHAIN · WORKSPACE</p><p class="copy">Choose a harvest to see its journey details and private notes saved on this device.</p><div class="tabrow">'+batches.map(b=>'<button data-batch="'+b[0]+'" class="'+(batch===b[0]?'active':'')+'">'+b[0]+'</button>').join('')+'</div>'+card('Batch notebook',(function(){let b=batches.find(x=>x[0]===batch)||batches[0];return '<div class="row"><div><b>'+b[1]+' · '+b[0]+'</b><small>'+b[2]+'</small></div><span class="pill">'+b[3]+'</span></div><label class="field">Notes for this batch<textarea id="notes" placeholder="Harvest details, handling notes, buyer instructions, delivery updates…"></textarea></label><p class="small" id="savedNote">Saved automatically on this device</p>'})(),'BATCH NOTEBOOK')+card('Journey record','<div class="row"><div><b>Harvest and pickup</b><small>Nuwara Eliya · 8:42 AM</small></div><span class="pill">Recorded</span></div><div class="row"><div><b>Checkpoint</b><small>Kandy · awaiting driver check-in</small></div><span class="badge">In progress</span></div><div class="row"><div><b>Destination</b><small>Colombo flower market</small></div></div>'+btn('Open driver journey','driver'));
if(id==='routes')return '<p class="eyebrow">DRIVING DIRECTIONS</p><p class="copy">Choose a start and destination to view a route and travel-time estimate. Open directions in Google Maps for live traffic.</p>'+card('Plan a route','<div class="grid2"><label class="field">From<select id="routeFrom"><option>Nuwara Eliya</option><option selected>Kandy</option><option>Badulla</option><option>Ella</option><option>Haputale</option><option>Colombo</option><option>Galle</option></select></label><label class="field">To<select id="routeTo"><option>Nuwara Eliya</option><option>Kandy</option><option selected>Colombo</option><option>Badulla</option><option>Ella</option><option>Haputale</option><option>Galle</option></select></label></div><div class="row"><div><small>Estimated drive</small><b id="routeEta">Finding route…</b></div><div><small>Distance</small><b id="routeDistance">—</b></div></div>'+routeMap()+'<a class="btn secondary" id="googleLink" href="https://www.google.com/maps/dir/?api=1&origin=Kandy&destination=Colombo&travelmode=driving" target="_blank" rel="noreferrer">Open Google Maps ↗</a><p class="footnote">Fastest route estimate; live traffic is not included. Map data © OpenStreetMap contributors · Routing by OSRM.</p>','ROUTE PLANNER')+card('Driver route','<p class="copy">The Driver pathway opens with the current sample trip: Kandy to Colombo.</p>'+btn('Open driver pathway','driver'));
if(id==='care')return '<p class="eyebrow">CROP CARE GUIDE</p><p class="copy">Search flowers and vegetables for transport targets, harvest advice, packaging, storage and handling risks. Values are literature-based starting estimates requiring local calibration.</p><input class="search" id="cropSearch" placeholder="Search crops">'+ '<div class="tabrow" id="cropFilters"><button class="active" data-filter="All">All</button><button data-filter="Flower">Flowers</button><button data-filter="Vegetable">Vegetables</button></div>'+card('Flower profiles','<div class="crop" data-crop="Rose" data-type="Flower"><span><b>Rose</b><small>0–2°C · 90–95% RH · 7–14 days in storage</small></span><span>›</span></div><div class="crop" data-crop="Carnation" data-type="Flower"><span><b>Carnation</b><small>0–2°C · 90–95% RH · 14–21 days in storage</small></span><span>›</span></div><div class="crop" data-crop="Chrysanthemum" data-type="Flower"><span><b>Chrysanthemum</b><small>0–2°C · 90–95% RH · 14–21 days in storage</small></span><span>›</span></div><div class="crop" data-crop="Alstroemeria" data-type="Flower"><span><b>Alstroemeria</b><small>0–2°C · 90–95% RH · 7–14 days in storage</small></span><span>›</span></div><div class="crop" data-crop="Anthurium" data-type="Flower"><span><b>Anthurium</b><small>13–15°C · protect from chilling</small></span><span>›</span></div><div class="crop" data-crop="Lily" data-type="Flower"><span><b>Lily</b><small>Cool, shaded handling · avoid crushing buds</small></span><span>›</span></div>')+card('Transport checklist','<label class="row"><span><input type="checkbox"> Harvest at recommended stage</span></label><label class="row"><span><input type="checkbox"> Move crop into shade</span></label><label class="row"><span><input type="checkbox"> Pre-cool within 1–2 hours</span></label><label class="row"><span><input type="checkbox"> Pack upright with ventilation</span></label><label class="row"><span><input type="checkbox"> Take pickup photo</span></label>')+'<p class="footnote">Profiles are starting estimates, not verified Sri Lankan operating limits. Calibrate with local transit experiments.</p>';
if(id==='alerts')return '<p class="eyebrow">BARRIERS & FIXES</p><p class="copy">Review conditions that can reduce freshness and choose a practical next step for each journey.</p>'+card('Dispatch recommendation','<div class="notice"><b>Fog expected — adjust the departure window</b><br>Review visibility and route conditions before leaving. A cooler evening trip may protect freshness.</div>'+btn('Open route planner','routes','btn secondary'))+['Fog or rain delay|Low visibility may add two hours. Check the forecast and move dispatch when safe.','Landslide or road closure|Confirm current road status before taking a detour. Compare the extra time and heat.','Tourist traffic|Ella and Nuwara Eliya peak periods may slow loads. Avoid busy hours where possible.','Hot vehicle|Use shade, airflow and suitable cooling. Do not leave flowers in a sun-heated cabin.','Rough handling|Pack upright, use sleeves and keep heavy loads off the crop.','Long stops|Set a stop-time limit and park out of direct sun.','Delivery dispute|Keep pickup and arrival photos, timestamps and checkpoint records together.'].map((x,i)=>{let s=x.split('|');return card('<span class="alertitem"><span class="alerticon">'+['☁','↗','♧','♨','▣','◷','✓'][i]+'</span><span><b>'+s[0]+'</b><small>'+s[1]+'</small></span></span>',btn('Review next step',i===6?'guarantee':'driver','btn ghost'))}).join('');
if(id==='register')return '<p class="eyebrow">NEW HARVEST · FARMER</p><p class="copy">Add crop and pickup details before your batch leaves the farm. Demo submission only.</p>'+card('Register a crop batch','<label class="field">Crop type<select><option>Flower</option><option>Vegetable</option></select></label><div class="grid2"><label class="field">Crop<select><option>Rose</option><option>Carnation</option><option>Chrysanthemum</option><option>Anthurium</option></select></label><label class="field">Quantity<input type="number" value="120"></label></div><label class="field">Harvest time<input type="datetime-local"></label><label class="field">Destination<input value="Colombo flower market"></label><label class="field">Packaging<select><option>Cool box + wet wrap</option><option>Ventilated carton</option><option>Upright crate</option></select></label><label class="field">Harvest photo<input type="file" accept="image/*" capture="environment"></label><button class="btn full" data-action="register">Create batch and QR</button>','BATCH DETAILS');

function render(){routeRequest++;if(map){map.remove();map=null;routeLayer=null}
const idx=pages.findIndex(x=>x[0]===page),title=pages[idx][1];const stage=document.getElementById('stage');
if(page==='welcome'){stage.innerHTML='<div class="phone"><div class="welcome"><div class="status">9:41</div><span class="welcome-mark"></span><h2>Hill Country Connect</h2><p>Fresh from the hills, tracked all the way.</p><p class="welcome-prompt">I am a...</p><div class="welcome-roles">'+['Farmer','Driver','Buyer','Tourist'].map(r=>'<button data-role="'+r+'">'+r+'</button>').join('')+'</div><div class="languages"><button data-action="lang" aria-label="English (selected)">EN</button> <button data-action="lang" aria-label="Sinhala">සිං</button> <button data-action="lang" aria-label="Tamil">த</button></div></div></div>'}
else{stage.innerHTML='<div class="phone"><div class="app-head"><div class="headrow"><span>9:41 · <span id="clock">—</span> Sri Lanka</span><span>◉ LIVE</span></div><h2>'+title+'</h2><div class="role-switch">'+['Farmer','Driver','Buyer','Tourist'].map(r=>'<button class="'+(r===role?'active':'')+'" data-role="'+r+'">'+r+'</button>').join('')+'</div></div><main class="scroll">'+bodyFor(page)+'</main><nav class="bottom">'+navPages.map(x=>'<button class="'+(x[0]===page?'active':'')+'" data-page="'+x[0]+'"><i>'+x[1]+'</i>'+x[2]+'</button>').join('')+'</nav></div>'}
document.querySelectorAll('.jumps button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.target===page)));document.getElementById('cap').textContent='Page '+(idx+1)+' of '+pages.length+': '+title;
if(page==='routes'||page==='driver')wireRoute(page);
if(page==='batches'){let ta=document.getElementById('notes');let key='prototype-notes-'+batch;ta.value=localStorage.getItem(key)||'';ta.oninput=()=>{localStorage.setItem(key,ta.value);document.getElementById('savedNote').textContent='Saved just now on this device'}}
if(page==='care')wireCare();if(page==='shop')wireShop();updateClock();if(page==='overview'||page==='crowd')refreshWeather()}
function go(id){if(!pages.some(p=>p[0]===id))return;if(id!==page)hist.push(page);page=id;render()}
document.addEventListener('click',e=>{const jump=e.target.closest('[data-target]');if(jump){go(jump.dataset.target);return}const p=e.target.closest('[data-page]');if(p){go(p.dataset.page);return}const r=e.target.closest('[data-role]');if(r){role=r.dataset.role;page=roleHome();hist.push(page);render();return}const b=e.target.closest('[data-batch]');if(b){batch=b.dataset.batch;render();return}const c=e.target.closest('[data-category]');if(c){category=c.dataset.category;render();return}const f=e.target.closest('[data-filter]');if(f){document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===f));wireCare(f.dataset.filter);return}const crop=e.target.closest('[data-crop]');if(crop){toast(crop.dataset.crop+' profile · See temperature, harvest, packing and storage guidance.');return}const a=e.target.closest('[data-action]');if(a){toast(({register:'Batch HC–2049 created. QR ready to print (demo).',checkin:'Checked in at Kandy. Freshness and journey record updated (demo).',claim:'Claim submitted with the journey evidence (demo).',lang:'Sinhala and Tamil are planned for Semester 2.',save:'Place saved (demo).'})[a.dataset.action]||'Saved in this prototype.')}})
document.getElementById('back').onclick=()=>{if(hist.length>1){page=hist.pop();render()}};document.getElementById('restart').onclick=()=>{hist=['welcome'];page='welcome';render()};document.getElementById('toggle').onclick=()=>document.getElementById('stage').classList.toggle('show');document.getElementById('rotate').onclick=()=>{let i=['Farmer','Driver','Buyer','Tourist'].indexOf(role);role=['Farmer','Driver','Buyer','Tourist'][(i+1)%4];page=roleHome();hist.push(page);render()};
function wireCare(filter='All'){let search=document.getElementById('cropSearch');let apply=()=>document.querySelectorAll('[data-crop]').forEach(x=>{x.classList.toggle('hidden',!x.dataset.crop.toLowerCase().includes((search.value||'').toLowerCase())||(filter!=='All'&&x.dataset.type!==filter))});if(search)search.oninput=apply;apply()}
function wireShop(){let search=document.getElementById('shopSearch');if(search)search.oninput=()=>document.querySelectorAll('.product').forEach(x=>x.classList.toggle('hidden',!x.innerText.toLowerCase().includes(search.value.toLowerCase())))}
function loadLeaflet(){if(window.L)return Promise.resolve(window.L);if(leafletPromise)return leafletPromise;leafletPromise=new Promise((resolve,reject)=>{let css=document.querySelector('link[data-leaflet-proto]');if(!css){css=document.createElement('link');css.rel='stylesheet';css.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';css.dataset.leafletProto='true';document.head.appendChild(css)}let script=document.querySelector('script[data-leaflet-proto]');if(!script){script=document.createElement('script');script.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';script.dataset.leafletProto='true';script.async=true;document.head.appendChild(script)}if(window.L){resolve(window.L);return}script.addEventListener('load',()=>window.L?resolve(window.L):reject(Error('Map library unavailable')),{once:true});script.addEventListener('error',()=>reject(Error('Map library unavailable')),{once:true})});return leafletPromise}
function wireRoute(screen){const city={'Nuwara Eliya':[6.9497,80.7891],Kandy:[7.2906,80.6337],Colombo:[6.9271,79.8612],Badulla:[6.9934,81.055],Ella:[6.8667,81.0466],Haputale:[6.765,80.951],Galle:[6.0535,80.221]};const from=document.getElementById(screen==='driver'?'driverFrom':'routeFrom'),to=document.getElementById(screen==='driver'?'driverTo':'routeTo');if(!from||!to)return;const eta=document.getElementById(screen==='driver'?'driverEta':'routeEta'),dist=document.getElementById(screen==='driver'?'driverDistance':'routeDistance'),link=document.getElementById(screen==='driver'?'driverGoogle':'googleLink'),mapNode=document.getElementById('routeMapCanvas');const token=++routeRequest;let mapReady=false;const updateLink=()=>{link.href='https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(from.value+', Sri Lanka')+'&destination='+encodeURIComponent(to.value+', Sri Lanka')+'&travelmode=driving'};const update=async()=>{const request=++routeRequest;const a=city[from.value],b=city[to.value];updateLink();eta.textContent='Finding route…';dist.textContent='—';try{const response=await fetch('https://router.project-osrm.org/route/v1/driving/'+a[1]+','+a[0]+';'+b[1]+','+b[0]+'?overview=full&geometries=geojson');if(!response.ok)throw Error();const data=await response.json();if(data.code!=='Ok'||!data.routes?.[0])throw Error();if(request!==routeRequest||!mapReady)return;const selected=data.routes[0];routeLayer?.remove();const line=window.L.geoJSON(selected.geometry,{style:{color:'#1E5B3A',weight:5,opacity:.92}});const start=window.L.marker([a[0],a[1]]).bindPopup('Start · '+from.value);const end=window.L.marker([b[0],b[1]]).bindPopup('Destination · '+to.value);routeLayer=window.L.featureGroup([line,start,end]).addTo(map);map.fitBounds(line.getBounds(),{padding:[20,20]});const minutes=Math.max(1,Math.round(selected.duration/60)),hours=Math.floor(minutes/60);eta.textContent=(hours?hours+' hr '+minutes%60+' min':minutes+' min');dist.textContent=(selected.distance/1000).toFixed(1)+' km';document.querySelectorAll('.maptag b').forEach(x=>x.textContent=eta.textContent+' · '+dist.textContent)}catch{if(request!==routeRequest)return;eta.textContent='Route unavailable';dist.textContent='—';const box=document.getElementById('routeMapCanvas');if(box)box.insertAdjacentHTML('beforeend','<div class="map-error">Could not load the route. Use Google Maps or retry when connected.</div>')}};from.onchange=update;to.onchange=update;updateLink();const setup=async()=>{try{const L=await loadLeaflet();if(token!==routeRequest||!document.getElementById('routeMapCanvas'))return;map=L.map(mapNode).setView(city[from.value],8);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'}).addTo(map);mapReady=true;await update()}catch{eta.textContent='Map unavailable · Open Google Maps';dist.textContent='—'}};void setup()}
let weatherTimer;async function refreshWeather(){try{const res=await fetch('https://api.open-meteo.com/v1/forecast?latitude=6.9497&longitude=80.7891&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code&hourly=precipitation_probability&forecast_days=1&timezone=Asia%2FColombo');if(!res.ok)throw Error();const d=await res.json(),c=d.current,desc=weatherName(c.weather_code),temp=Math.round(c.temperature_2m),upd=new Date(c.time).toLocaleTimeString('en-LK',{hour:'numeric',minute:'2-digit'});const v=document.getElementById('weatherValue'),dt=document.getElementById('weatherDetails'),u=document.getElementById('weatherUpdated'),ic=document.getElementById('weatherIcon');if(v){v.textContent=desc+' · '+temp+'°C';dt.textContent='Nuwara Eliya · Feels like '+Math.round(c.apparent_temperature)+'°C';u.textContent='LIVE · Updated '+upd;ic.textContent=c.weather_code<=2?'☀️':'☁️'}const tv=document.getElementById('tourWeatherValue'),td=document.getElementById('tourWeatherDetails');if(tv){tv.textContent=desc+' · '+temp+'°C';td.textContent='Feels like '+Math.round(c.apparent_temperature)+'°C';document.getElementById('feels').textContent=Math.round(c.apparent_temperature)+'°C';document.getElementById('humidity').textContent=c.relative_humidity_2m+'%';const ix=d.hourly.time.findIndex(t=>t===c.time);document.getElementById('rain').textContent=(d.hourly.precipitation_probability[ix]??0)+'%';document.getElementById('tourWeatherIcon').textContent=c.weather_code<=2?'☀️':'☁️'}}catch{const v=document.getElementById('weatherUpdated');if(v)v.textContent='Weather temporarily unavailable · retrying'}clearTimeout(weatherTimer);weatherTimer=setTimeout(refreshWeather,15*60*1000)}
function weatherName(c){if(c===0)return'Clear sky';if(c<=2)return'Partly cloudy';if(c===3)return'Overcast';if(c<=48)return'Fog';if(c<=67)return'Rain';if(c<=77)return'Snow';if(c<=82)return'Rain showers';return'Thunderstorm'}
function updateClock(){const now=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Colombo'}));const el=document.getElementById('clock');if(el)el.textContent=now.toLocaleTimeString('en-LK',{hour:'numeric',minute:'2-digit'});const welcome=document.getElementById('localClock');if(welcome)welcome.textContent=now.toLocaleDateString('en-LK',{weekday:'long',day:'numeric',month:'long'})+' · '+now.toLocaleTimeString('en-LK',{hour:'numeric',minute:'2-digit'})+' SRI LANKA TIME';const g=document.getElementById('greeting');if(g){const h=now.getHours();g.textContent=(h<12?'Good morning':h<17?'Good afternoon':'Good evening')}setTimeout(updateClock,30000)}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}
pages.forEach((p,i)=>{let b=document.createElement('button');b.textContent=i+1;b.dataset.target=p[0];b.title=p[1];document.getElementById('jumps').appendChild(b)});function fit(){let s=Math.min(1,(innerHeight-215)/812,(innerWidth-24)/375);s=Math.max(.45,s);let el=document.getElementById('stage');el.style.transform='scale('+s+')';el.style.marginBottom=812*(s-1)+'px'}addEventListener('resize',fit);fit();render();
